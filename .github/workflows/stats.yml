name: Refresh stats

# Fetches fresh GitHub and LeetCode numbers every few hours, redraws stats/*.svg in the Playful style
# (in the activity section's theme, in both the Day and Night looks) and commits them, together with the numbers in tools/stats.json.
# Run it by hand from the Actions tab ("Refresh stats" -> "Run workflow") to update right away.
on:
  schedule:
    - cron: "37 1,7,13,19 * * *"  # every 6 hours (GitHub sometimes drops a scheduled run); commits only when numbers change
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/gen_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch numbers and draw the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/gen_stats.py . --fetch
          RAHUL_MODE=night python tools/gen_stats.py night      # the Night set the README shows after 7 pm

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats night/stats tools/stats.json
          if git diff --cached --quiet; then
            echo "Numbers unchanged."
          else
            git commit -m "Refresh GitHub and LeetCode stats"
            git pull --rebase origin main
            git push
          fi
