name: Switch theme

# Run it from the Actions tab: "Switch theme" -> "Run workflow".
#   * pick one colour in "theme" to recolour the whole profile, and/or
#   * pick a colour for individual sections (header, about, projects, activity, connect, game)
#     to mix themes, e.g. a green banner with a blue About card.
# "keep" leaves a section exactly as it is. It regenerates the banner, About card, project cards, the stats cards,
# Let's Connect, the game page and the README colour codes, then commits the result.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: One colour for the WHOLE profile (resets any mix); keep = leave as it is
        type: choice
        default: keep
        options:        # keep in sync with THEMES in tools/theme_colors.py
          - keep
          - yellow
          - orange
          - rose
          - violet
          - blue
          - cyan
          - green
      header:
        description: Banner, typing line and badges only; keep = leave as it is
        type: choice
        default: keep
        options:        # keep in sync with THEMES in tools/theme_colors.py
          - keep
          - yellow
          - orange
          - rose
          - violet
          - blue
          - cyan
          - green
      about:
        description: About card and Tech Stack only; keep = leave as it is
        type: choice
        default: keep
        options:        # keep in sync with THEMES in tools/theme_colors.py
          - keep
          - yellow
          - orange
          - rose
          - violet
          - blue
          - cyan
          - green
      projects:
        description: Project cards only; keep = leave as it is
        type: choice
        default: keep
        options:        # keep in sync with THEMES in tools/theme_colors.py
          - keep
          - yellow
          - orange
          - rose
          - violet
          - blue
          - cyan
          - green
      activity:
        description: GitHub stats and LeetCode only; keep = leave as it is
        type: choice
        default: keep
        options:        # keep in sync with THEMES in tools/theme_colors.py
          - keep
          - yellow
          - orange
          - rose
          - violet
          - blue
          - cyan
          - green
      connect:
        description: Let's Connect only; keep = leave as it is
        type: choice
        default: keep
        options:        # keep in sync with THEMES in tools/theme_colors.py
          - keep
          - yellow
          - orange
          - rose
          - violet
          - blue
          - cyan
          - green
      game:
        description: Game page only; keep = leave as it is
        type: choice
        default: keep
        options:        # keep in sync with THEMES in tools/theme_colors.py
          - keep
          - yellow
          - orange
          - rose
          - violet
          - blue
          - cyan
          - green
      extra:
        description: "Optional single project cards, e.g. bitnote=rose datapilot=cyan (card names are in tools/README.md)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow fonttools brotli      # fonttools + brotli: the labels embed only the letters they use

      - name: Apply theme
        env:
          THEME: ${{ inputs.theme }}
          HEADER: ${{ inputs.header }}
          ABOUT: ${{ inputs.about }}
          PROJECTS: ${{ inputs.projects }}
          ACTIVITY: ${{ inputs.activity }}
          CONNECT: ${{ inputs.connect }}
          GAME: ${{ inputs.game }}
          EXTRA: ${{ inputs.extra }}
        run: |
          args=()
          [ "$THEME" != "keep" ] && args+=("$THEME")
          for pair in "header=$HEADER" "about=$ABOUT" "projects=$PROJECTS" "activity=$ACTIVITY" "connect=$CONNECT" "game=$GAME"; do
            [ "${pair#*=}" != "keep" ] && args+=("$pair")
          done
          # free text, passed as plain words; theme.py rejects anything that is not a known name
          read -r -a extra <<< "$EXTRA"
          args+=("${extra[@]}")
          if [ "${#args[@]}" -eq 0 ]; then
            echo "Nothing selected - every option is on 'keep'."
            exit 0
          fi
          python tools/theme.py "${args[@]}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed - already on that theme."
          else
            git commit -m "Switch theme to $(python tools/theme.py --summary)"
            git push
          fi
