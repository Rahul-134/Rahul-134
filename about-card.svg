  <line x1="0" y1="40" x2="900" y2="40" stroke="#2a2a2a"/>

  <!-- terminal text, revealed line by line by sliding a background-coloured cover to the right -->
  <g class="term">
        <text class="mono" x="44" y="90" font-size="18"><tspan fill="#E8D44D">$</tspan> <tspan fill="#FFFFFF">whoami</tspan></text>
    <text class="mono" x="44" y="118" font-size="18"><tspan fill="#FFFFFF" font-weight="700">Rahul Lumbhani</tspan><tspan fill="#9aa0a6"> — full-stack developer</tspan></text>
    <text class="mono" x="44" y="146" font-size="18"><tspan fill="#E8D44D">$</tspan> <tspan fill="#FFFFFF">cat</tspan> <tspan fill="#86D7A3">focus.txt</tspan></text>
    <text class="mono" x="44" y="174" font-size="18"><tspan fill="#C9D1D9">AI-driven data platforms and productivity tools</tspan></text>
    <text class="mono" x="44" y="202" font-size="18"><tspan fill="#E8D44D">$</tspan> <tspan fill="#FFFFFF">ls</tspan> <tspan fill="#86D7A3">./stack</tspan></text>
    <text class="mono" x="44" y="230" font-size="18"><tspan fill="#C9D1D9">FastAPI  SQLite  React  Node.js  vanilla-JS</tspan></text>
    <text class="mono" x="44" y="258" font-size="18"><tspan fill="#E8D44D">$</tspan> <tspan fill="#FFFFFF">./builds</tspan> <tspan fill="#86D7A3">--list</tspan></text>
    <text class="mono" x="44" y="286" font-size="18"><tspan fill="#C9D1D9">AI co-pilots · web apps · interactive console games</tspan></text>
    <g class="last"><text class="mono" x="44" y="314" font-size="18"><tspan fill="#E8D44D">$</tspan></text><rect class="blink" x="68" y="298" width="10" height="20" fill="#E8D44D"/></g>
        <rect class="cv c0" x="40" y="70" width="760" height="28" fill="#161616"/>
    <rect class="cv c1" x="40" y="98" width="760" height="28" fill="#161616"/>
    <rect class="cv c2" x="40" y="126" width="760" height="28" fill="#161616"/>
