<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-labelledby="t d">
  <title id="t">About Rahul Lumbhani</title>
  <desc id="d">A terminal window types out: whoami, Rahul Lumbhani, full-stack developer; focus, AI-driven data platforms and productivity tools; stack, FastAPI, SQLite, React, Node.js and vanilla JS; builds, AI co-pilots, web apps and interactive console games. A pixel dinosaur stands beside a cactus.</desc>
  <style>
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .c0{animation:k0 18s linear infinite}
    @keyframes k0{0%,3.333%{transform:translateX(0);animation-timing-function:steps(8,end)}6.667%,100%{transform:translateX(96px)}}
    .c1{animation:k1 18s linear infinite}
    @keyframes k1{0%,9.444%{transform:translateX(0);animation-timing-function:steps(37,end)}13.556%,100%{transform:translateX(410px)}}
    .c2{animation:k2 18s linear infinite}
    @keyframes k2{0%,16.667%{transform:translateX(0);animation-timing-function:steps(15,end)}22.500%,100%{transform:translateX(172px)}}
    .c3{animation:k3 18s linear infinite}
    @keyframes k3{0%,23.889%{transform:translateX(0);animation-timing-function:steps(47,end)}29.111%,100%{transform:translateX(518px)}}
    .c4{animation:k4 18s linear infinite}
    @keyframes k4{0%,32.222%{transform:translateX(0);animation-timing-function:steps(12,end)}36.889%,100%{transform:translateX(140px)}}
    .c5{animation:k5 18s linear infinite}
    @keyframes k5{0%,38.889%{transform:translateX(0);animation-timing-function:steps(43,end)}43.667%,100%{transform:translateX(474px)}}
    .c6{animation:k6 18s linear infinite}
    @keyframes k6{0%,47.222%{transform:translateX(0);animation-timing-function:steps(17,end)}53.833%,100%{transform:translateX(194px)}}
    .c7{animation:k7 18s linear infinite}
    @keyframes k7{0%,55.000%{transform:translateX(0);animation-timing-function:steps(51,end)}60.667%,100%{transform:translateX(561px)}}
    .last{animation:last 18s linear infinite}
    @keyframes last{0%,63.323%{opacity:0}63.333%,100%{opacity:1}}
    .blink{animation:blink 1.05s steps(1,end) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .term{animation:fade 18s linear infinite}
    @keyframes fade{0%,90.000%{opacity:1}95.556%,100%{opacity:0}}
    .bob{animation:bob 2.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .legA{animation:legA .5s steps(1,end) infinite}
    .legB{animation:legB .5s steps(1,end) infinite}
    @keyframes legA{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
    @keyframes legB{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cv{display:none}.term,.last,.blink,.bob,.legA,.legB{animation:none}.legB{opacity:0}}
  </style>
  <defs>
    <radialGradient id="halo" cx="0.88" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#E8D44D" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E8D44D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8D44D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8D44D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E8D44D" stop-opacity="0"/>
    </linearGradient>
  </defs>

