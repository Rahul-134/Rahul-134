    .c8{animation:k8 19.3s linear infinite}
    @keyframes k8{0%,51.399%{transform:translateX(0);animation-timing-function:steps(17,end)}57.565%,100%{transform:translateX(194px)}}
    .c9{animation:k9 19.3s linear infinite}
    @keyframes k9{0%,58.860%{transform:translateX(0);animation-timing-function:steps(51,end)}64.145%,100%{transform:translateX(561px)}}
