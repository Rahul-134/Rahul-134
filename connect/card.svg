<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Let's connect</title>
  <desc id="d">Let's build something useful, together. Open to interesting projects and conversations about AI, backend engineering and building useful products. A pixel dinosaur hops and says hey.</desc>
  <style>
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .caret{animation:caret 1.1s steps(1,end) infinite}
    @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    .shine{animation:shine 7s ease-in-out infinite}
    @keyframes shine{0%,62%{transform:translateX(0)}100%{transform:translateX(1320px)}}
    .hop{animation:hop 3.6s cubic-bezier(.3,.6,.4,1) infinite}
    @keyframes hop{0%,6%{transform:translateY(0)}16%{transform:translateY(-34px)}28%,100%{transform:translateY(0)}}
    .say{transform-box:fill-box;transform-origin:85% 100%;animation:say 3.6s ease-out infinite}
    @keyframes say{0%,22%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.06)}34%{transform:scale(1)}78%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(.9)}}
    .tw{animation:tw 3.2s ease-in-out infinite;opacity:.15}
    @keyframes tw{0%,100%{opacity:.1}50%{opacity:.8}}
    @media (prefers-reduced-motion:reduce){.pulse,.caret,.shine,.hop,.say,.tw{animation:none}.say{opacity:1}.tw{opacity:.5}}
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="300" rx="20"/></clipPath>
  </defs>
  
  <rect width="900" height="300" rx="20" fill="#151515"/>
  <rect width="900" height="300" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="19.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#card)"><g class="shine" style="animation-delay:0.0s"><rect x="-260" y="-40" width="130" height="380" fill="url(#beam)" transform="skewX(-18)"/></g></g>

  <!-- status pill -->
  <rect x="44" y="40" width="218" height="26" rx="13" fill="#4ADE80" fill-opacity="0.10" stroke="#4ADE80" stroke-opacity="0.35"/>
  <circle class="pulse" cx="60" cy="53" r="4" fill="#4ADE80"/>
  <text x="74" y="58" font-size="11.5" fill="#4ADE80" letter-spacing="1.5" font-family="'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">OPEN TO CONVERSATIONS</text>

  <!-- headline -->
  <text x="44" y="124" font-size="40" font-weight="800" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Let's build something</text>
  <text x="44" y="170" font-size="40" font-weight="800" fill="#4ADE80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">useful, together.</text>
  <text x="44" y="206" font-size="14.5" fill="#9aa0a6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Interesting projects and conversations about AI,</text>
  <text x="44" y="226" font-size="14.5" fill="#9aa0a6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">backend engineering and building useful products.</text>

  <!-- prompt -->
  <text x="44" y="268" font-size="14" font-family="'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#4ADE80">$</tspan><tspan fill="#FFFFFF"> say hello</tspan><tspan class="caret" fill="#4ADE80">_</tspan></text>

