<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Let's connect</title>
  <desc id="d">Let's build something useful, together. Open to interesting projects and conversations about AI, backend engineering and building useful products. A pixel dinosaur hops and says hey.</desc>
  <style>
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .caret{animation:caret 1.1s steps(1,end) infinite}
    @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    .shine{animation:shine 7s ease-in-out infinite}
    @keyframes shine{0%,62%{transform:translateX(0)}100%{transform:translateX(1320px)}}
    .hop{animation:hop 3.6s cubic-bezier(.3,.6,.4,1) infinite}
    @keyframes hop{0%,6%{transform:translateY(0)}16%{transform:translateY(-34px)}28%,100%{transform:translateY(0)}}
    .say{transform-box:fill-box;transform-origin:85% 100%;animation:say 3.6s ease-out infinite}
    @keyframes say{0%,22%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.06)}34%{transform:scale(1)}78%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(.9)}}
    .tw{animation:tw 3.2s ease-in-out infinite;opacity:.15}
    @keyframes tw{0%,100%{opacity:.1}50%{opacity:.8}}
    @media (prefers-reduced-motion:reduce){.pulse,.caret,.shine,.hop,.say,.tw{animation:none}.say{opacity:1}.tw{opacity:.5}}
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="300" rx="20"/></clipPath>
  </defs>
  
  <rect width="900" height="300" rx="20" fill="#151515"/>
  <rect width="900" height="300" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="19.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#card)"><g class="shine" style="animation-delay:0.0s"><rect x="-260" y="-40" width="130" height="380" fill="url(#beam)" transform="skewX(-18)"/></g></g>

  <!-- status pill -->
  <rect x="44" y="40" width="218" height="26" rx="13" fill="#4ADE80" fill-opacity="0.10" stroke="#4ADE80" stroke-opacity="0.35"/>
  <circle class="pulse" cx="60" cy="53" r="4" fill="#4ADE80"/>
  <text x="74" y="58" font-size="11.5" fill="#4ADE80" letter-spacing="1.5" font-family="'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">OPEN TO CONVERSATIONS</text>

  <!-- headline -->
  <text x="44" y="124" font-size="40" font-weight="800" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Let's build something</text>
  <text x="44" y="170" font-size="40" font-weight="800" fill="#4ADE80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">useful, together.</text>
  <text x="44" y="206" font-size="14.5" fill="#9aa0a6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Interesting projects and conversations about AI,</text>
  <text x="44" y="226" font-size="14.5" fill="#9aa0a6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">backend engineering and building useful products.</text>

  <!-- prompt -->
  <text x="44" y="268" font-size="14" font-family="'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace"><tspan fill="#4ADE80">$</tspan><tspan fill="#FFFFFF"> say hello</tspan><tspan class="caret" fill="#4ADE80">_</tspan></text>

  <!-- scene -->
  <g class="tw" style="animation-delay:0s"><path d="M588 72v12M582 78h12" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="tw" style="animation-delay:0.9s"><path d="M872 106v12M866 112h12" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="tw" style="animation-delay:1.7s"><path d="M700 46v12M694 52h12" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="tw" style="animation-delay:2.4s"><path d="M560 154v12M554 160h12" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" fill="none"/></g>
  <path d="M520 246 H 872" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
  <path d="M560 255 h14 M640 255 h30 M760 255 h10 M820 255 h22" stroke="#2f2f2f" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(586,204)"><path fill="#43602F" d="M24 0h3v3h-3zM24 3h3v3h-3zM24 6h3v3h-3zM36 6h3v3h-3zM24 9h3v3h-3zM36 9h3v3h-3zM24 12h3v3h-3zM36 12h3v3h-3zM36 15h3v3h-3zM12 18h3v3h-3zM24 18h3v3h-3zM12 21h3v3h-3zM24 21h3v3h-3zM12 24h3v3h-3zM24 24h3v3h-3zM24 27h3v3h-3zM24 30h3v3h-3zM24 33h3v3h-3zM24 36h3v3h-3zM24 39h3v3h-3z"/><path fill="#6B8F52" d="M21 0h3v3h-3zM21 3h3v3h-3zM21 6h3v3h-3zM33 6h3v3h-3zM21 9h3v3h-3zM33 9h3v3h-3zM21 12h3v3h-3zM33 12h3v3h-3zM21 15h15v3h-15zM9 18h3v3h-3zM21 18h3v3h-3zM9 21h3v3h-3zM21 21h3v3h-3zM9 24h3v3h-3zM21 24h3v3h-3zM9 27h15v3h-15zM21 30h3v3h-3zM21 33h3v3h-3zM21 39h3v3h-3z"/><path fill="#9CBF80" d="M18 0h3v3h-3zM18 3h3v3h-3zM18 6h3v3h-3zM30 6h3v3h-3zM18 9h3v3h-3zM30 9h3v3h-3zM18 12h3v3h-3zM30 12h3v3h-3zM18 15h3v3h-3zM6 18h3v3h-3zM18 18h3v3h-3zM6 21h3v3h-3zM18 21h3v3h-3zM6 24h3v3h-3zM18 24h3v3h-3zM6 27h3v3h-3zM18 30h3v3h-3zM18 33h3v3h-3zM18 36h3v3h-3zM18 39h3v3h-3z"/><path fill="#E6EBD2" d="M21 36h3v3h-3z"/></g>
  <g transform="translate(634,222)"><path fill="#43602F" d="M15 0h3v3h-3zM15 3h3v3h-3zM6 6h3v3h-3zM18 6h3v3h-3zM6 9h3v3h-3zM18 9h3v3h-3zM18 12h3v3h-3zM15 15h3v3h-3zM15 18h3v3h-3zM15 21h3v3h-3z"/><path fill="#6B8F52" d="M12 0h3v3h-3zM12 3h3v3h-3zM3 6h3v3h-3zM15 6h3v3h-3zM3 9h3v3h-3zM15 9h3v3h-3zM3 12h15v3h-15zM12 15h3v3h-3zM12 18h3v3h-3zM12 21h3v3h-3z"/><path fill="#9CBF80" d="M9 0h3v3h-3zM9 3h3v3h-3zM0 6h3v3h-3zM12 6h3v3h-3zM0 9h3v3h-3zM12 9h3v3h-3zM0 12h3v3h-3zM9 15h3v3h-3zM9 18h3v3h-3zM9 21h3v3h-3z"/></g>
  <g class="hop">
    <g transform="translate(846,168) scale(-1,1)"><path fill="#24AC55" d="M33 27h3v3h-3zM30 30h6v3h-6zM27 33h6v3h-6zM0 36h3v3h-3zM24 36h6v3h-6zM0 39h6v3h-6zM21 39h6v3h-6zM0 42h9v3h-9zM18 42h6v3h-6zM3 45h18v3h-18zM6 48h15v3h-15zM9 51h12v3h-12zM12 54h9v3h-9zM15 57h6v3h-6zM18 60h6v3h-6zM18 63h6v3h-6z"/><path fill="#4ADE80" d="M39 3h27v3h-27zM36 6h33v3h-33zM36 9h6v3h-6zM48 9h21v3h-21zM36 12h33v3h-33zM36 15h33v3h-33zM36 18h30v3h-30zM36 21h15v3h-15zM36 24h24v3h-24zM36 27h21v3h-21zM36 30h21v3h-21zM33 33h27v3h-27zM30 36h30v3h-30zM63 36h6v3h-6zM27 39h36v3h-36zM66 39h3v3h-3zM24 42h36v3h-36zM21 45h39v3h-39zM21 48h39v3h-39zM21 51h36v3h-36zM21 54h36v3h-36zM24 57h30v3h-30zM24 60h27v3h-27zM24 63h24v3h-24z"/><path fill="#98E7B5" d="M39 0h24v3h-24zM36 3h3v3h-3zM21 57h3v3h-3z"/><path fill="#161616" d="M45 9h3v3h-3zM51 21h15v3h-15z"/><path fill="#FFFFFF" d="M42 9h3v3h-3z"/><g transform="translate(0,66)"><path fill="#24AC55" d="M42 0h15v3h-15zM42 3h9v3h-9zM42 6h6v3h-6z"/><path fill="#4ADE80" d="M21 0h15v3h-15zM21 3h9v3h-9zM21 6h9v3h-9zM21 9h12v3h-12z"/></g></g>
  </g>
  <g class="say">
    <rect x="662" y="104" width="96" height="40" rx="14" fill="#FFFFFF"/>
    <path d="M750 142 L772 160 L764 138 Z" fill="#FFFFFF"/>
    <text x="710" y="130" text-anchor="middle" font-size="19" font-weight="800" fill="#161616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">hey!</text>
  </g>
</svg>
