<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d">
  <title id="t">Hey I am Rahul Lumbhani — AI/ML Engineer · GenAI Enthusiast</title>
  <desc id="d">An animated pixel dinosaur runs along the ground and jumps over cacti. Click to play the full game.</desc>
  <style>
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .jump{animation:jump 6s linear infinite}
    .cactus{animation:run 6s linear infinite}
    .cactusB{animation:run 6s linear infinite;animation-delay:-3s}
    .legA{animation:legA .24s steps(1,end) infinite}
    .legB{animation:legB .24s steps(1,end) infinite}
    .ground{animation:scroll 1.026s linear infinite}
    .cloud1{animation:cloud 34s linear infinite}
    .cloud2{animation:cloud 34s linear infinite;animation-delay:-17s}
    @keyframes jump{0%{transform:translateY(0)}19.89%{transform:translateY(-0px)}21.14%{transform:translateY(-19px)}22.39%{transform:translateY(-35px)}23.64%{transform:translateY(-49px)}24.89%{transform:translateY(-60px)}26.14%{transform:translateY(-69px)}27.39%{transform:translateY(-75px)}28.64%{transform:translateY(-79px)}29.89%{transform:translateY(-80px)}31.14%{transform:translateY(-79px)}32.39%{transform:translateY(-75px)}33.64%{transform:translateY(-69px)}34.89%{transform:translateY(-60px)}36.14%{transform:translateY(-49px)}37.39%{transform:translateY(-35px)}38.64%{transform:translateY(-19px)}39.89%{transform:translateY(-0px)}69.12%{transform:translateY(-0px)}70.37%{transform:translateY(-19px)}71.62%{transform:translateY(-35px)}72.87%{transform:translateY(-49px)}74.12%{transform:translateY(-60px)}75.37%{transform:translateY(-69px)}76.62%{transform:translateY(-75px)}77.87%{transform:translateY(-79px)}79.12%{transform:translateY(-80px)}80.37%{transform:translateY(-79px)}81.62%{transform:translateY(-75px)}82.87%{transform:translateY(-69px)}84.12%{transform:translateY(-60px)}85.37%{transform:translateY(-49px)}86.62%{transform:translateY(-35px)}87.87%{transform:translateY(-19px)}89.12%{transform:translateY(-0px)}100%{transform:translateY(0)}}
    @keyframes run{from{transform:translateX(1050px)}to{transform:translateX(-120px)}}
    @keyframes legA{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
    @keyframes legB{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-200px)}}
    @keyframes cloud{from{transform:translateX(1100px)}to{transform:translateX(-160px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    @media (prefers-reduced-motion:reduce){.jump,.cactus,.cactusB,.legA,.legB,.ground,.cloud1,.cloud2,.cursor{animation:none}.cactus{transform:translateX(640px)}.cactusB{transform:translateX(860px)}.cloud1{transform:translateX(220px)}.cloud2{transform:translateX(780px)}.legB{opacity:0}}
  </style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ADE80" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
  </defs>

