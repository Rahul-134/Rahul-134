<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d">
  <title id="t">Hey I am Rahul Lumbhani — AI and Backend Engineer</title>
  <desc id="d">An animated pixel dinosaur runs along the ground and jumps over cacti. Click to play the full game.</desc>
  <style>
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .jump{animation:jump 6s linear infinite}
    .cactus{animation:run 6s linear infinite}
    .cactusB{animation:run 6s linear infinite;animation-delay:-3s}
    .legA{animation:legA .24s steps(1,end) infinite}
    .legB{animation:legB .24s steps(1,end) infinite}
    .ground{animation:scroll 1.081s linear infinite}
    .cloud1{animation:cloud 34s linear infinite}
    .cloud2{animation:cloud 34s linear infinite;animation-delay:-17s}
    @keyframes jump{0%{transform:translateY(0)}24.17%{transform:translateY(-0px)}26.67%{transform:translateY(-38px)}30.00%{transform:translateY(-69px)}33.33%{transform:translateY(-80px)}36.67%{transform:translateY(-69px)}40.00%{transform:translateY(-38px)}42.50%{transform:translateY(-0px)}74.17%{transform:translateY(-0px)}76.67%{transform:translateY(-38px)}80.00%{transform:translateY(-69px)}83.33%{transform:translateY(-80px)}86.67%{transform:translateY(-69px)}90.00%{transform:translateY(-38px)}92.50%{transform:translateY(-0px)}100%{transform:translateY(0)}}
    @keyframes run{from{transform:translateX(1050px)}to{transform:translateX(-60px)}}
    @keyframes legA{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
    @keyframes legB{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-200px)}}
    @keyframes cloud{from{transform:translateX(1100px)}to{transform:translateX(-160px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cursor{animation:blink 1.1s steps(1,end) infinite}
    @media (prefers-reduced-motion:reduce){.jump,.cactus,.cactusB,.legA,.legB,.ground,.cloud1,.cloud2,.cursor{animation:none}.cactus{transform:translateX(640px)}.cactusB{transform:translateX(860px)}.cloud1{transform:translateX(220px)}.cloud2{transform:translateX(780px)}.legB{opacity:0}}
  </style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8D44D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8D44D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8D44D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#E8D44D" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E8D44D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="290" rx="16" fill="#161616"/>
  <rect width="1000" height="290" rx="16" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="999" height="289" rx="15.5" fill="none" stroke="#2a2a2a"/>
  <rect x="300" y="0" width="400" height="2" fill="url(#glow)"/>

  <!-- clouds -->
  <g fill="#262626">
    <g class="cloud1"><g transform="translate(0,52)"><rect x="12" y="0" width="52" height="8" rx="4"/><rect x="0" y="8" width="84" height="8" rx="4"/><rect x="24" y="-8" width="28" height="8" rx="4"/></g></g>
    <g class="cloud2"><g transform="translate(0,186)"><rect x="12" y="0" width="52" height="8" rx="4"/><rect x="0" y="8" width="84" height="8" rx="4"/><rect x="24" y="-8" width="28" height="8" rx="4"/></g></g>
  </g>

  <!-- hi score -->
  <text class="mono" x="968" y="40" text-anchor="end" font-size="16" fill="#6b6b6b" letter-spacing="2">HI 00134</text>

  <!-- title -->
  <text class="mono" x="500" y="104" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">Hey I am Rahul Lumbhani</text>
  <text class="mono" x="500" y="150" text-anchor="middle" font-size="22" fill="#E8D44D" letter-spacing="3">AI and Backend Engineer<tspan class="cursor">_</tspan></text>

  <!-- ground -->
  <line x1="0" y1="236" x2="1000" y2="236" stroke="#3a3a3a" stroke-width="2"/>
  <line class="ground" x1="0" y1="247" x2="1400" y2="247" stroke="#2f2f2f" stroke-width="2" stroke-dasharray="20 40 8 62 4 66"/>
  <line class="ground" x1="-70" y1="257" x2="1330" y2="257" stroke="#262626" stroke-width="2" stroke-dasharray="6 54 14 40 4 82"/>

  <!-- cacti -->
  <g class="cactus"><path transform="translate(0,187)" fill="#A3A3A3" d="M16 0h8v4h-8zM16 4h8v4h-8zM0 8h4v4h-4zM16 8h8v4h-8zM32 8h4v4h-4zM0 12h4v4h-4zM16 12h8v4h-8zM32 12h4v4h-4zM0 16h8v4h-8zM16 16h8v4h-8zM28 16h8v4h-8zM4 20h32v4h-32zM16 24h8v4h-8zM16 28h8v4h-8zM16 32h8v4h-8zM16 36h8v4h-8zM16 40h8v4h-8zM16 44h8v4h-8z"/></g>
  <g class="cactusB"><path transform="translate(0,187)" fill="#A3A3A3" d="M16 0h8v4h-8zM16 4h8v4h-8zM0 8h4v4h-4zM16 8h8v4h-8zM32 8h4v4h-4zM0 12h4v4h-4zM16 12h8v4h-8zM32 12h4v4h-4zM0 16h8v4h-8zM16 16h8v4h-8zM28 16h8v4h-8zM4 20h32v4h-32zM16 24h8v4h-8zM16 28h8v4h-8zM16 32h8v4h-8zM16 36h8v4h-8zM16 40h8v4h-8zM16 44h8v4h-8z"/></g>

  <!-- dino -->
  <g transform="translate(100,151)">
    <g class="jump">
      <path fill="#E8D44D" d="M40 0h32v4h-32zM40 4h36v4h-36zM40 8h8v4h-8zM52 8h28v4h-28zM40 12h40v4h-40zM40 16h40v4h-40zM40 20h28v4h-28zM40 24h24v4h-24zM0 28h4v4h-4zM36 28h28v4h-28zM0 32h4v4h-4zM32 32h36v4h-36zM0 36h8v4h-8zM28 36h40v4h-40zM0 40h12v4h-12zM28 40h40v4h-40zM72 40h4v4h-4zM4 44h64v4h-64zM72 44h4v4h-4zM8 48h64v4h-64zM12 52h56v4h-56zM16 56h48v4h-48zM20 60h44v4h-44zM24 64h36v4h-36z"/>
      <g transform="translate(0,68)" fill="#E8D44D">
        <path class="legA" d="M24 0h20v4h-20zM48 0h16v4h-16zM24 4h12v4h-12zM48 4h8v4h-8zM24 8h8v4h-8zM48 8h4v4h-4zM24 12h12v4h-12z"/>
        <path class="legB" d="M24 0h20v4h-20zM48 0h16v4h-16zM24 4h8v4h-8zM48 4h12v4h-12zM24 8h4v4h-4zM48 8h8v4h-8zM48 12h12v4h-12z"/>
      </g>
    </g>
  </g>

  <text class="mono" x="500" y="276" text-anchor="middle" font-size="12" fill="#6b6b6b" letter-spacing="2">CLICK TO PLAY  ·  SPACE / TAP TO JUMP</text>
</svg>
