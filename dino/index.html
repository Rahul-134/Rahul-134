<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Run · Rahul Lumbhani</title>
<meta name="description" content="A playable dino runner game from Rahul Lumbhani's GitHub profile.">
<style>
  :root { --bg:#161616; --card:#1d1d1d; --line:#2a2a2a; --accent:#22D3EE; --fg:#D6D6D6; --muted:#8B8B8B; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:20px 16px;
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
    background:radial-gradient(900px 400px at 50% 0%, rgba(34,211,238,.08), transparent 70%), var(--bg);
  }
  h1 { margin:0; font-size:clamp(20px,4vw,30px); color:#fff; letter-spacing:.5px; text-align:center; }
  h1 span { color:var(--accent); }
  p.sub { margin:0; color:var(--muted); font-size:13px; text-align:center; }
  .stage { width:min(100%,900px); }
  canvas {
    display:block; width:100%; height:auto; background:var(--bg);
    border:1px solid var(--line); border-radius:14px;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer;
  }
  canvas:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .controls { display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap; }
  button {
    font:inherit; font-size:14px; color:#161616; background:var(--accent); border:0; border-radius:10px;
    padding:12px 22px; cursor:pointer; user-select:none; touch-action:manipulation; min-height:44px;
  }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .hint { color:var(--muted); font-size:12px; text-align:center; line-height:1.7; }
  kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:1px 7px; background:var(--card); color:var(--fg); font:inherit; font-size:11px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <h1>Hey, I'm Rahul — <span>let's play</span> 🦖</h1>
  <p class="sub">Dodge the cacti and birds. How far can you go?</p>

  <div class="stage">
    <canvas id="game" tabindex="0" aria-label="Dino runner game. Press space or tap to jump, down arrow to duck."></canvas>
    <div class="controls">
      <button id="jumpBtn" type="button">⬆ Jump</button>
      <button id="duckBtn" type="button" class="ghost">⬇ Duck (hold)</button>
    </div>
  </div>

  <p class="hint">
    <kbd>Space</kbd> / <kbd>↑</kbd> jump &nbsp;·&nbsp; <kbd>↓</kbd> duck &nbsp;·&nbsp; tap the screen on mobile<br>
    <a href="https://github.com/Rahul-134">← Back to my GitHub profile</a>
  </p>

<script>
(function () {
  'use strict';

  // ---------- Setup ----------
  var W = 900, H = 260, GROUND = 214;
  var DPR = Math.min(window.devicePixelRatio || 1, 3);
  var cv = document.getElementById('game');
  cv.width = W * DPR; cv.height = H * DPR;
  var ctx = cv.getContext('2d');
  ctx.scale(DPR, DPR);

  var COL = { bg:'#161616', ground:'#3a3a3a', dash:'#2f2f2f', cloud:'#262626', text:'#6b6b6b', hot:'#22D3EE' };

  // ---------- Pixel art (shared with the profile banner) ----------
    var PAL = {"Y": "#22D3EE", "D": "#1298AD", "L": "#79DEEE", "K": "#161616", "W": "#FFFFFF", "G": "#4DAE6C", "g": "#2F7A4D", "h": "#86D7A3", "S": "#D9F2E0", "P": "#F472B6", "X": "#D6D6D6"};
  var ART = {
    dinoBody: [".............LLLLLLLL", "............LYYYYYYYYY", "............YYYYYYYYYYY", "............YYWKYYYYYYY", "............YYYYYYYYYYY", "............YYYYYYYYYYY", "............YYYYYYYYYY", "............YYYYYKKKKK", "............YYYYYYYY", "...........DYYYYYYY", "..........DDYYYYYYY", ".........DDYYYYYYYYY", "D.......DDYYYYYYYYYY.YY", "DD.....DDYYYYYYYYYYYY.Y", "DDD...DDYYYYYYYYYYYY", ".DDDDDDYYYYYYYYYYYYY", "..DDDDDYYYYYYYYYYYYY", "...DDDDYYYYYYYYYYYY", "....DDDYYYYYYYYYYYY", ".....DDLYYYYYYYYYY", "......DDYYYYYYYYY", "......DDYYYYYYYY"],
    legsA: [".......YYYYY..DDDDD", ".......YYY....DDD", ".......YYY....DD", ".......YYYY"],
    legsB: [".......YYYYY..DDDDD", ".......YY.....DDDD", ".......Y......DDD", "..............DDDD"],
    duckBody: ["................LLLLLLLL", "...............LYYYYYYYYY", "...............YYYYYYYYYYY", "...............YYWKYYYYYYY", "...............YYYYYYYYYYY", "...............YYYYYYYYYY", "...............YYYYYKKKKK", "..DDDDDDDDDDDDYYYYYYYY", ".DDYYYYYYYYYYYYYYYYYYY", "DDYYYYYYYYYYYYYYYYYYY", "DDDYYYYYYYYYYYYYYYYY", ".DDDDYYYYYYYYYYYYYYY", "..DDDDDYYYYYYYYYYYY", "....DDDDYYYYYYYYYY"],
    duckLegsA: ["......YYYY...DDDD", "......YYY....DD", "......YYYY"],
    duckLegsB: ["......YYYY...DDDD", "......YY.....DDD", ".............DDDD"],
    saguaro: ["......hGg", "......hGg", "......hGg.hGg", "......hGg.hGg", "......hGg.hGg", "......hGGGGGg", "..hGg.hGg", "..hGg.hGg", "..hGg.hGg", "..hGGGGGg", "......hGg", "......hGg", "......hSg", "......hGg"],
    small: ["...hGg", "...hGg", "hGg.hGg", "hGg.hGg", "hGGGGGg", "...hGg", "...hGg", "...hGg"],
    barrel: ["....PP", "...hGGGg", "..hGGGGGg", ".hGGSGGGGg", ".hGGGGGGGg", ".hGGGGSGGg", "..hGGGGGg"],
    birdUp: ["..........X", ".........XX", "........XXX", ".......XXXX", "......XXXXXX", "XXXXXXXXXXXXXXX", "..XXXXXXXXXXXXXX", "....XXXXXXXXXX", "......XXXXX"],
    birdDown: ["", "", "..........X", "XXXXXXXXXXXXXXX", "..XXXXXXXXXXXXXX", "....XXXXXXXXXX", "......XXXXXXX", ".......XXXXX", ".........XX"],
  };

  function pad(rows) {
    var w = 0; rows.forEach(function (r) { if (r.length > w) w = r.length; });
    return rows.map(function (r) { while (r.length < w) r += '.'; return r; });
  }

  function sprite(rows, u) {
    rows = pad(rows);
    var c = document.createElement('canvas');
    c.width = rows[0].length * u * DPR; c.height = rows.length * u * DPR;
    var g = c.getContext('2d'); var s = u * DPR;
    for (var y = 0; y < rows.length; y++)
      for (var x = 0; x < rows[y].length; x++) {
        var ch = rows[y][x];
        if (ch === '.') continue;
        g.fillStyle = PAL[ch]; g.fillRect(x * s, y * s, s, s);
      }
    return { c: c, w: rows[0].length * u, h: rows.length * u };
  }

  var U = 3;
  var dinoA = sprite(ART.dinoBody.concat(ART.legsA), U);
  var dinoB = sprite(ART.dinoBody.concat(ART.legsB), U);
  var duckA = sprite(ART.duckBody.concat(ART.duckLegsA), U);
  var duckB = sprite(ART.duckBody.concat(ART.duckLegsB), U);
  var CACT = { saguaro: sprite(ART.saguaro, U), small: sprite(ART.small, U), barrel: sprite(ART.barrel, U) };
  var birdUp = sprite(ART.birdUp, U);
  var birdDown = sprite(ART.birdDown, U);

  // cactus clusters; the harder ones only appear once the run is under way
  var EASY_COMBOS = [['small'], ['barrel'], ['saguaro'], ['small', 'small'], ['barrel', 'small']];
  var HARD_COMBOS = EASY_COMBOS.concat([['saguaro', 'small'], ['saguaro', 'barrel'], ['barrel', 'small', 'barrel'], ['small', 'saguaro', 'small']]);

  // ---------- State ----------
  var state = 'ready';            // ready | running | over
  var speed, distance, score, hi = 0, frame, nextGap, diedAt;
  var dino, obstacles, clouds, groundOff, ducking = false;

  try { hi = parseInt(localStorage.getItem('dinoHi'), 10) || 0; } catch (e) {}

  function reset() {
    speed = 6; distance = 0; score = 0; frame = 0; groundOff = 0;
    dino = { x: 60, y: GROUND - dinoA.h, vy: 0, onGround: true };
    obstacles = [];
    nextGap = 380;
    clouds = [{ x: 220, y: 50 }, { x: 600, y: 90 }, { x: 860, y: 40 }];
  }
  reset();

  // ---------- Input ----------
  function jump() {
    if (state === 'ready') { state = 'running'; last = performance.now(); }
    else if (state === 'over') { if (performance.now() - diedAt > 400) { reset(); state = 'running'; last = performance.now(); } return; }
    if (dino.onGround && !ducking) { dino.vy = -11.6; dino.onGround = false; }
  }
  function setDuck(v) { ducking = v; }

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) jump(); }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); setDuck(true); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') setDuck(false);
  });
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); cv.focus({ preventScroll: true }); jump(); });

  var jumpBtn = document.getElementById('jumpBtn'), duckBtn = document.getElementById('duckBtn');
  jumpBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); });
  duckBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); setDuck(true); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { duckBtn.addEventListener(n, function () { setDuck(false); }); });
  jumpBtn.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); } });

  // ---------- Game logic ----------
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  function spawn() {
    if (score > 250 && Math.random() < 0.3) {
      var low = Math.random() < 0.5;                       // low: jump over · mid: duck under
      var h = birdUp.h;
      obstacles.push({ type: 'bird', x: W + 20, w: birdUp.w, h: h, y: low ? GROUND - 18 - h : GROUND - 56 - h, f: 0 });
    } else {
      var combo = pick(score > 150 ? HARD_COMBOS : EASY_COMBOS);
      var parts = [], dx = 0;
      combo.forEach(function (name) {
        parts.push({ name: name, s: CACT[name], dx: dx });
        dx += CACT[name].w + 5;
      });
      obstacles.push({ type: 'cactus', x: W + 20, parts: parts, w: dx - 5 });
    }
    nextGap = speed * rnd(26, 46) + 120;
  }

  function dinoBox() {
    if (ducking && dino.onGround) return { x: dino.x + 6, y: GROUND - duckA.h + 4, w: duckA.w - 20, h: duckA.h - 6 };
    return { x: dino.x + 12, y: dino.y + 4, w: dinoA.w - 22, h: dinoA.h - 8 };
  }

  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  function boxesOf(o) {                          // slightly forgiving hitboxes
    if (o.type === 'bird') return [{ x: o.x + 5, y: o.y + 5, w: o.w - 10, h: o.h - 8 }];
    return o.parts.map(function (p) { return { x: o.x + p.dx + 4, y: GROUND - p.s.h + 3, w: p.s.w - 8, h: p.s.h - 5 }; });
  }

  function update(dt) {
    frame += dt;
    distance += speed * dt;
    score = Math.floor(distance * 0.025);
    speed = Math.min(6 + distance * 0.00045, 14);
    groundOff = (groundOff + speed * dt) % 200;

    // dino physics
    var g = ducking && !dino.onGround ? 1.9 : 0.62;
    if (!dino.onGround) {
      dino.vy += g * dt;
      dino.y += dino.vy * dt;
      if (dino.y >= GROUND - dinoA.h) { dino.y = GROUND - dinoA.h; dino.vy = 0; dino.onGround = true; }
    }

    // clouds
    clouds.forEach(function (c) { c.x -= speed * 0.15 * dt; if (c.x < -90) { c.x = W + rnd(20, 200); c.y = rnd(30, 110); } });

    // obstacles
    obstacles.forEach(function (o) { o.x -= (speed + (o.type === 'bird' ? 1.5 : 0)) * dt; if (o.type === 'bird') o.f += dt; });
    obstacles = obstacles.filter(function (o) { return o.x + o.w > -20; });
    var lastO = obstacles[obstacles.length - 1];
    if (!lastO || (W - (lastO.x + lastO.w)) > nextGap) spawn();

    // collisions
    var d = dinoBox();
    for (var i = 0; i < obstacles.length; i++) {
      var bs = boxesOf(obstacles[i]);
      for (var j = 0; j < bs.length; j++) if (hit(d, bs[j])) { gameOver(); return; }
    }
  }

  function gameOver() {
    state = 'over'; diedAt = performance.now();
    if (score > hi) { hi = score; try { localStorage.setItem('dinoHi', String(hi)); } catch (e) {} }
  }

  // ---------- Rendering ----------
  function padScore(n) { return ('00000' + n).slice(-5); }

  function drawCloud(x, y) {
    ctx.fillStyle = COL.cloud;
    rr(x + 12, y, 52, 8); rr(x, y + 8, 84, 8); rr(x + 24, y - 8, 28, 8);
  }
  function rr(x, y, w, h) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, 4); else ctx.rect(x, y, w, h); ctx.fill(); }

  function drawGround() {
    ctx.fillStyle = COL.ground; ctx.fillRect(0, GROUND + 1, W, 2);
    ctx.strokeStyle = COL.dash; ctx.lineWidth = 2;
    var patterns = [[20, 40, 8, 62, 4, 66], [6, 54, 14, 40, 4, 82]];
    for (var p = 0; p < 2; p++) {
      ctx.setLineDash(patterns[p]);
      ctx.lineDashOffset = groundOff + (p ? 70 : 0);
      ctx.beginPath(); ctx.moveTo(0, GROUND + 12 + p * 10); ctx.lineTo(W + 200, GROUND + 12 + p * 10); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawDino() {
    var step = state === 'running' && Math.floor(frame / 6) % 2;
    if (ducking && dino.onGround) {
      var d = step ? duckA : duckB;
      ctx.drawImage(d.c, dino.x, GROUND - d.h, d.w, d.h);
    } else {
      var s = (!dino.onGround || state !== 'running') ? dinoA : (step ? dinoA : dinoB);
      ctx.drawImage(s.c, dino.x, dino.y, s.w, s.h);
    }
  }

  function drawObstacles() {
    obstacles.forEach(function (o) {
      if (o.type === 'cactus') {
        o.parts.forEach(function (p) { ctx.drawImage(p.s.c, o.x + p.dx, GROUND - p.s.h, p.s.w, p.s.h); });
      } else {
        var s = Math.floor(o.f / 8) % 2 ? birdUp : birdDown;
        ctx.drawImage(s.c, o.x, o.y, s.w, s.h);
      }
    });
  }

  function centerText(t, y, size, color) {
    ctx.font = '700 ' + size + 'px "JetBrains Mono",ui-monospace,Consolas,Menlo,monospace';
    ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.fillText(t, W / 2, y);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
    clouds.forEach(function (c) { drawCloud(c.x, c.y); });
    drawGround(); drawObstacles(); drawDino();

    // score
    ctx.font = '700 18px "JetBrains Mono",ui-monospace,Consolas,Menlo,monospace';
    ctx.textAlign = 'right';
    var flash = state === 'running' && score > 0 && score % 100 < 6 && Math.floor(frame / 5) % 2;
    ctx.fillStyle = COL.text; ctx.fillText('HI ' + padScore(hi), W - 120, 32);
    ctx.fillStyle = flash ? '#fff' : COL.hot; ctx.fillText(padScore(score), W - 24, 32);

    if (state === 'ready') {
      centerText('PRESS SPACE OR TAP TO START', 100, 22, '#FFFFFF');
      centerText('↑ jump   ·   ↓ duck', 132, 14, COL.text);
    } else if (state === 'over') {
      centerText('G A M E   O V E R', 96, 28, '#FFFFFF');
      centerText('SPACE / TAP TO RESTART', 128, 14, COL.hot);
    }
  }

  // ---------- Loop ----------
  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 16.667, 3);
    last = now;
    if (state === 'running') update(dt);
    render();
    requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () { last = performance.now(); });
  requestAnimationFrame(loop);
  
})();
</script>
</body>
</html>
