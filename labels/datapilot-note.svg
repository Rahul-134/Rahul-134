<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="900" height="72" role="img" aria-labelledby="t">
  <title id="t">The screens below are the real app, shown on a made-up sample dataset (used-car listings).</title>
  <style>
    @font-face{font-family:'Baloo 2';font-weight:400 800;src:url(data:font/woff2;base64,) format('woff2')}
