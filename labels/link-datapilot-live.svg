<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 62" width="213" height="62" role="img" aria-labelledby="t">
  <title id="t">Live app</title>
  <style>
    @font-face{font-family:'Baloo 2';font-weight:400 800;src:url(data:font/woff2;base64,) format('woff2')}
    text{font-family:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
    .nudge{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
    .bob{animation:bob 2.8s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="7" y="7" width="200.9" height="52" rx="26.0" fill="#2B1A12"/>
  <rect x="2" y="2" width="200.9" height="52" rx="26.0" fill="#5BD68A" stroke="#2B1A12" stroke-width="3"/>
  <circle cx="36" cy="28.0" r="16" fill="#fff" stroke="#2B1A12" stroke-width="2.6"/><circle class="pulse" cx="36" cy="28.0" r="7" fill="#5BD68A" stroke="#2B1A12" stroke-width="1.8"/>
  <text x="66" y="35.0" font-size="21" font-weight="800" fill="#2B1A12">Live app</text>
  <g class="nudge"><circle cx="175.9" cy="28.0" r="15" fill="#fff" stroke="#2B1A12" stroke-width="2.4"/>
  <text x="175.9" y="34.5" text-anchor="middle" font-size="17" font-weight="800" fill="#2B1A12">↗</text></g>
</svg>
