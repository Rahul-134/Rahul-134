<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80" role="img" aria-labelledby="t">
  <title id="t">Load game: resume any of your saved games</title>
  <style>
    @font-face{font-family:'Baloo 2';font-weight:400 800;src:url(data:font/woff2;base64,) format('woff2')}
    text{font-family:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
    .nudge{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
    .bob{animation:bob 2.8s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="11" y="11" width="886" height="66" rx="20" fill="#0C0B16"/><rect x="3" y="3" width="886" height="66" rx="20" fill="#2C2A45" stroke="#0C0B16" stroke-width="4"/>
  <rect x="29.0" y="22.0" width="106.3" height="34" rx="17.0" fill="#0C0B16"/><rect x="26.0" y="19.0" width="106.3" height="34" rx="17.0" fill="#60A5FA" stroke="#0C0B16" stroke-width="2.5"/><text x="40.0" y="41.4" font-size="15" font-weight="800" fill="#0C0B16" letter-spacing="0.3">Load game</text>
  <text x="150.3" y="43.0" font-size="19" font-weight="600" fill="#F4ECDD">resume any of your saved games</text>
</svg>
