  <title id="t">DataPilot: Dashboard: upload CSV or Excel files for instant stats, a data health score and a column profile; Data cleaning: remove duplicates and handle nulls with a live preview, then download the cleaned file; Natural-language analysis: ask in plain English (or by voice); Gemini writes the pandas code, which is shown for transparency, and returns the results; AI web scraper: URL and search modes with pagination detection, relevance filtering and a multi-model fallback; ML trainer: regression and classification with automatic hyperparameter tuning, reports, predictions, seven chart types and Python code export</title>
