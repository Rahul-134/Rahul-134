  <circle cx="52" cy="40.0" r="27" fill="#4ADE80" stroke="#0C0B16" stroke-width="3"/><g transform="translate(36.0,24.0) scale(1.333)"><path d="M8 5.5l1.5-2.5h5L16 5.5h4a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2z" fill="#fff" stroke="#0C0B16" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="4.4" fill="#4ADE80" stroke="#0C0B16" stroke-width="1.8"/><circle cx="13.3" cy="11.2" r="1.2" fill="#fff"/><circle cx="18.5" cy="8.6" r="1" fill="#0C0B16"/></g></g>
