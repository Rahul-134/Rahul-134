<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 88" width="900" height="88" role="img" aria-labelledby="t">
  <title id="t">Peek inside DataPilot: 7 screens. Tap to open.</title>
  <style>
    @font-face{font-family:'Baloo 2';font-weight:400 800;src:url(data:font/woff2;base64,) format('woff2')}
    text{font-family:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
    .nudge{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
    .bob{animation:bob 2.8s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .tap{animation:tap 2.2s ease-in-out infinite}
    @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="11" y="11" width="886" height="74" rx="22" fill="#0C0B16"/><rect x="3" y="3" width="886" height="74" rx="22" fill="#2C2A45" stroke="#0C0B16" stroke-width="4"/>
