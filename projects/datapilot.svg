<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-labelledby="t d">
  <title id="t">DataPilot</title>
  <desc id="d">DataPilot: AI-powered data analysis, web scraping and machine learning in one workspace. Ask your data questions in plain English. AI web scraper with pagination &amp; search mode. No-code ML trainer with auto hyperparameter tuning. Charts, reports and exportable Python code. Built with FastAPI, Streamlit, scikit-learn, Gemini.</desc>
  <style>
    .float{animation:float 6s ease-in-out infinite alternate}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
    .shine{animation:shine 7s ease-in-out infinite}
    @keyframes shine{0%,62%{transform:translateX(0)}100%{transform:translateX(1320px)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .caret{animation:caret 1.1s steps(1,end) infinite}
    @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.6s ease-in-out infinite alternate}
    @keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.float,.shine,.pulse,.caret,.bar{animation:none}}
  </style>
