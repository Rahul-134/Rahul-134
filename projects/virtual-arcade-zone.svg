<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 196" width="440" height="196" role="img" aria-labelledby="t d">
  <title id="t">Virtual Arcade Zone</title>
  <desc id="d">Virtual Arcade Zone: 7 mini-games — Hangman, Simon Says, Hand Cricket and more — in pure core Java. Built with Java, OOP.</desc>
  <style>
    .bob{animation:bobm 2.6s ease-in-out infinite alternate}
    @keyframes bobm{from{transform:translate(36.0px,66.0px)}to{transform:translate(36.0px,61.0px)}}
    .shine{animation:shine 8s ease-in-out infinite}
    @keyframes shine{0%,65%{transform:translateX(0)}100%{transform:translateX(800px)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.bob,.shine,.pulse{animation:none}}
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D44D" stop-opacity="0.5"/><stop offset="0.5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#E8D44D" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8D44D" stop-opacity="0.12"/><stop offset="1" stop-color="#E8D44D" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect width="440" height="196" rx="18"/></clipPath>
  </defs>
  <rect width="440" height="196" rx="18" fill="#151515"/>
  <rect width="440" height="196" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="438.5" height="194.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="24" y="28" width="112" height="140" rx="14" fill="#101010" stroke="#2c2c2c"/><g class="bob" transform="translate(36.0,66.0)" fill="#E8D44D"><rect x="16" y="0" width="8" height="8"/><rect x="64" y="0" width="8" height="8"/><rect x="24" y="8" width="8" height="8"/><rect x="56" y="8" width="8" height="8"/><rect x="16" y="16" width="56" height="8"/><rect x="8" y="24" width="16" height="8"/><rect x="32" y="24" width="24" height="8"/><rect x="64" y="24" width="16" height="8"/><rect x="0" y="32" width="88" height="8"/><rect x="0" y="40" width="8" height="8"/><rect x="16" y="40" width="56" height="8"/><rect x="80" y="40" width="8" height="8"/><rect x="0" y="48" width="8" height="8"/><rect x="16" y="48" width="8" height="8"/><rect x="64" y="48" width="8" height="8"/><rect x="80" y="48" width="8" height="8"/><rect x="24" y="56" width="16" height="8"/><rect x="48" y="56" width="16" height="8"/></g><rect x="162" y="26" width="188" height="22" rx="11" fill="#E8D44D" fill-opacity="0.10" stroke="#E8D44D" stroke-opacity="0.35"/><circle class="pulse" cx="175" cy="37" r="3.2" fill="#E8D44D"/><text x="187" y="41" font-size="10.5" fill="#E8D44D" letter-spacing="1.3" font-family="'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">05 · CONSOLE ARCADE</text><text x="162" y="82" font-size="22" font-weight="800" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Virtual Arcade Zone</text><text x="162" y="108" font-size="12.5" fill="#9aa0a6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">7 mini-games — Hangman, Simon Says,</text><text x="162" y="126" font-size="12.5" fill="#9aa0a6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Hand Cricket and more — in pure core Java.</text><rect x="162" y="146" width="58" height="24" rx="12" fill="#1e1e1e" stroke="#303030"/><circle cx="175" cy="158" r="4" fill="#ED8B00"/><text x="186" y="162" font-size="12" fill="#D6D6D6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Java</text><rect x="228" y="146" width="51" height="24" rx="12" fill="#1e1e1e" stroke="#303030"/><circle cx="241" cy="158" r="4" fill="#C9D1D9"/><text x="252" y="162" font-size="12" fill="#D6D6D6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">OOP</text><text x="416" y="163" text-anchor="end" font-size="10.5" fill="#8b8b8b" letter-spacing="1.2" font-family="'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">OPEN ↗</text>
  <g clip-path="url(#card)"><g class="shine"><rect x="-220" y="-30" width="110" height="256" fill="url(#beam)" transform="skewX(-18)"/></g></g>
</svg>
